name: Update profile widget

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "widgets/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate widget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: myangell5522
          GH_DISPLAY_NAME: myangell
        run: node scripts/generate-widget.mjs

      - name: Commit widget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widgets/profile-card.svg
          if git diff --staged --quiet; then
            echo "Widget unchanged"
          else
            git commit -m "chore: refresh profile widget"
            git push
          fi
